location = /api/activity-session {
    proxy_pass http://127.0.0.1:8765/session;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;
}

location = /_activity_auth {
    internal;
    proxy_pass http://127.0.0.1:8765/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
}

location = /activities {
    return 308 /activities/;
}

location ^~ /activities/ {
    auth_request /_activity_auth;
    error_page 401 =302 /?access=required;
    try_files $uri $uri/ =404;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}
