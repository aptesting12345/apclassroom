<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Crossword</title>
<style>
:root {
  --page: #f3f5f7;
  --paper: #ffffff;
  --ink: #17191f;
  --muted: #68707d;
  --line: #d8dde5;
  --heavy: #24272e;
  --blue: #1769d2;
  --blue-soft: #dceafe;
  --yellow: #f3c94f;
  --green: #2d8658;
  --green-soft: #e0f2e8;
  --red: #c8423b;
  --red-soft: #fde7e5;
  --font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html { background: var(--page); }
body {
  margin: 0;
  min-height: 100dvh;
  padding: 24px;
  color: var(--ink);
  background: var(--page);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; }
.app { width: min(100%, 1040px); margin: 0 auto; }
.topbar {
  min-height: 64px;
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 2px solid var(--heavy);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
}
.brand { min-width: 0; display: flex; align-items: center; gap: 12px; }
.back-button {
  width: 42px;
  height: 42px;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 50%;
  display: grid;
  place-items: center;
  flex: 0 0 42px;
  color: var(--ink);
  background: var(--paper);
  text-decoration: none;
  cursor: pointer;
  transition: border-color 140ms ease, background 140ms ease;
}
.back-button:hover { border-color: #aeb5c0; background: #e9edf2; }
.back-button svg { width: 21px; height: 21px; display: block; }
.title-block { min-width: 0; }
.kicker {
  margin: 0 0 2px;
  color: var(--blue);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0;
  text-transform: uppercase;
}
h1 {
  margin: 0;
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(28px, 4vw, 38px);
  line-height: 1;
  letter-spacing: 0;
}
.progress-block { width: 180px; flex: 0 0 180px; }
.progress-copy {
  margin-bottom: 7px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 750;
}
.progress-copy strong { color: var(--ink); font-variant-numeric: tabular-nums; }
.progress-track { height: 5px; overflow: hidden; background: #dfe3e8; }
.progress-fill { width: 0; height: 100%; background: var(--blue); transition: width 180ms ease; }
.layout {
  display: grid;
  grid-template-columns: minmax(0, 620px) minmax(280px, 1fr);
  gap: 32px;
  align-items: start;
}
.puzzle-pane { min-width: 0; }
.current-clue {
  min-height: 58px;
  margin-bottom: 12px;
  padding: 10px 14px;
  border-left: 4px solid var(--blue);
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--paper);
}
.current-number {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  flex: 0 0 34px;
  color: #fff;
  background: var(--blue);
  font-size: 13px;
  font-weight: 850;
}
.current-copy { min-width: 0; }
.current-direction {
  display: block;
  margin-bottom: 2px;
  color: var(--muted);
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;
}
.current-text { font-size: 15px; font-weight: 720; line-height: 1.3; }
.board-frame {
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--paper);
  box-shadow: 0 16px 40px rgba(31, 38, 49, 0.1);
}
.grid {
  width: min(100%, 520px);
  aspect-ratio: 1;
  margin: 0 auto;
  border: 3px solid var(--heavy);
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  background: var(--heavy);
}
.cell {
  min-width: 0;
  min-height: 0;
  padding: 0;
  border: 0;
  border-right: 1px solid var(--heavy);
  border-bottom: 1px solid var(--heavy);
  border-radius: 0;
  display: grid;
  place-items: center;
  position: relative;
  color: var(--ink);
  background: var(--paper);
  font-size: clamp(28px, 7vw, 54px);
  font-weight: 650;
  line-height: 1;
  cursor: pointer;
  text-transform: uppercase;
  transition: background 100ms ease;
}
.cell:nth-child(5n) { border-right: 0; }
.cell:nth-child(n+21) { border-bottom: 0; }
.cell.related { background: var(--blue-soft); }
.cell.active { background: var(--yellow); box-shadow: inset 0 0 0 3px var(--ink); z-index: 1; }
.cell.incorrect { color: var(--red); background: var(--red-soft); }
.cell:focus-visible { outline: 3px solid var(--blue); outline-offset: -4px; z-index: 2; }
.cell-number {
  position: absolute;
  top: 5px;
  left: 6px;
  font-size: clamp(9px, 1.6vw, 13px);
  font-weight: 800;
  line-height: 1;
}
.actions { margin-top: 14px; display: flex; align-items: center; gap: 8px; }
.action-button {
  min-height: 42px;
  padding: 0 15px;
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--ink);
  background: var(--paper);
  font-size: 13px;
  font-weight: 760;
  cursor: pointer;
  transition: background 120ms ease, border-color 120ms ease;
}
.action-button:hover { border-color: #adb5c0; background: #e9edf2; }
.action-button.primary { margin-left: auto; color: #fff; border-color: var(--blue); background: var(--blue); }
.action-button.primary:hover { background: #0e56b6; }
.keyboard { display: none; margin-top: 14px; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 5px; }
.key {
  min-width: 0;
  height: 44px;
  padding: 0;
  border: 1px solid #cbd1d9;
  border-radius: 5px;
  color: var(--ink);
  background: var(--paper);
  font-size: 14px;
  font-weight: 800;
  cursor: pointer;
}
.key:active { background: var(--blue-soft); }
.key.wide { grid-column: span 3; }
.clues-pane { border-top: 4px solid var(--heavy); background: var(--paper); }
.clues-head { padding: 16px 18px 13px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.clues-head h2 {
  margin: 0;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 24px;
  letter-spacing: 0;
}
.clue-tabs { margin: 0 18px; display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--line); }
.clue-tab {
  min-height: 40px;
  padding: 0 8px;
  border: 0;
  border-bottom: 3px solid transparent;
  color: var(--muted);
  background: transparent;
  font-size: 12px;
  font-weight: 820;
  text-transform: uppercase;
  cursor: pointer;
}
.clue-tab[aria-selected="true"] { color: var(--blue); border-bottom-color: var(--blue); }
.clue-list { padding: 8px 10px 12px; }
.clue-list[hidden] { display: none; }
.clue {
  width: 100%;
  min-height: 48px;
  padding: 9px 10px;
  border: 0;
  border-bottom: 1px solid #eceef1;
  border-radius: 0;
  display: grid;
  grid-template-columns: 28px 1fr;
  gap: 4px;
  align-items: start;
  color: var(--ink);
  background: transparent;
  text-align: left;
  font-size: 14px;
  line-height: 1.35;
  cursor: pointer;
}
.clue:last-child { border-bottom: 0; }
.clue:hover { background: #f4f6f8; }
.clue.active { background: var(--blue-soft); }
.clue.solved { color: var(--green); }
.clue-number { font-weight: 850; }
.status {
  min-height: 44px;
  margin-top: 14px;
  padding: 11px 14px;
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--muted);
  background: var(--paper);
  font-size: 13px;
  font-weight: 700;
}
.status:empty { display: none; }
.status.success { color: var(--green); border-color: #aed4bd; background: var(--green-soft); }
.status.error { color: var(--red); border-color: #efb6b2; background: var(--red-soft); }
@media (max-width: 820px) {
  body { padding: 16px; }
  .layout { grid-template-columns: 1fr; gap: 24px; }
  .clues-pane { max-width: 620px; }
}
@media (max-width: 560px) {
  body { padding: 10px; }
  .topbar { margin-bottom: 14px; padding-bottom: 12px; }
  .back-button { width: 38px; height: 38px; flex-basis: 38px; }
  .progress-block { width: 90px; flex-basis: 90px; }
  .progress-copy span { display: none; }
  .board-frame { padding: 6px; }
  .grid { width: 100%; }
  .current-clue { min-height: 54px; padding: 8px 10px; }
  .actions { display: grid; grid-template-columns: 1fr 1fr 1fr; }
  .action-button { min-width: 0; padding: 0 6px; font-size: 12px; }
  .action-button.primary { margin-left: 0; }
  .keyboard { display: grid; }
  .key:nth-child(n+21) { grid-column: span 2; }
  .key.wide { grid-column: span 5; }
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <a class="back-button" href="index.html" data-calculator-back aria-label="Back to games" title="Back to games">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/><path d="M21 12H9"/></svg>
      </a>
      <div class="title-block"><p class="kicker">Mini No. 001</p><h1>Crossword</h1></div>
    </div>
    <div class="progress-block" aria-label="Puzzle progress">
      <div class="progress-copy"><span>Progress</span><strong id="progressText">0 / 25</strong></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
  </header>

  <main class="layout">
    <section class="puzzle-pane" aria-label="Crossword puzzle">
      <div class="current-clue" aria-live="polite">
        <span class="current-number" id="currentNumber">1A</span>
        <div class="current-copy">
          <span class="current-direction" id="currentDirection">Across</span>
          <span class="current-text" id="currentText">Vital organ</span>
        </div>
      </div>
      <div class="board-frame"><div class="grid" id="grid" role="grid" aria-label="5 by 5 crossword grid"></div></div>
      <div class="actions">
        <button class="action-button" id="clearBtn" type="button">Clear word</button>
        <button class="action-button" id="revealBtn" type="button">Reveal word</button>
        <button class="action-button primary" id="checkBtn" type="button">Check puzzle</button>
      </div>
      <div class="keyboard" id="keyboard" aria-label="Letter keyboard"></div>
      <div class="status" id="message" aria-live="polite"></div>
    </section>

    <aside class="clues-pane" aria-label="Crossword clues">
      <div class="clues-head"><h2>Clues</h2></div>
      <div class="clue-tabs" role="tablist" aria-label="Clue direction">
        <button class="clue-tab" id="acrossTab" type="button" role="tab" aria-selected="true" aria-controls="acrossClues">Across</button>
        <button class="clue-tab" id="downTab" type="button" role="tab" aria-selected="false" aria-controls="downClues">Down</button>
      </div>
      <div class="clue-list" id="acrossClues" role="tabpanel" aria-labelledby="acrossTab"></div>
      <div class="clue-list" id="downClues" role="tabpanel" aria-labelledby="downTab" hidden></div>
    </aside>
  </main>
</div>

<script src="game-guard.js?v=2"></script>
<script>
(() => {
  const SIZE = 5;
  const solution = ["HEART", "EMBER", "ABUSE", "RESIN", "TREND"];
  const numberMap = new Map([
    ["0,0", 1], ["0,1", 2], ["0,2", 3], ["0,3", 4], ["0,4", 5],
    ["1,0", 6], ["2,0", 7], ["3,0", 8], ["4,0", 9]
  ]);
  const clues = {
    across: [
      { number: 1, clue: "Vital organ", answer: "HEART", row: 0 },
      { number: 6, clue: "Glowing remnant of a fire", answer: "EMBER", row: 1 },
      { number: 7, clue: "Treat cruelly or misuse", answer: "ABUSE", row: 2 },
      { number: 8, clue: "Sticky substance used in varnish", answer: "RESIN", row: 3 },
      { number: 9, clue: "A general direction of change", answer: "TREND", row: 4 }
    ],
    down: [
      { number: 1, clue: "The center or core of something", answer: "HEART", col: 0 },
      { number: 2, clue: "A smoldering piece of wood", answer: "EMBER", col: 1 },
      { number: 3, clue: "Use something the wrong way", answer: "ABUSE", col: 2 },
      { number: 4, clue: "A pine tree secretion", answer: "RESIN", col: 3 },
      { number: 5, clue: "Current style or tendency", answer: "TREND", col: 4 }
    ]
  };

  const gridEl = document.getElementById("grid");
  const keyboardEl = document.getElementById("keyboard");
  const messageEl = document.getElementById("message");
  const progressText = document.getElementById("progressText");
  const progressFill = document.getElementById("progressFill");
  const currentNumber = document.getElementById("currentNumber");
  const currentDirection = document.getElementById("currentDirection");
  const currentText = document.getElementById("currentText");
  const answers = Array.from({ length: SIZE }, () => Array(SIZE).fill(""));
  let selected = [0, 0];
  let direction = "across";

  function entryCells(entryDirection, entry) {
    return Array.from({ length: SIZE }, (_, index) => entryDirection === "across" ? [entry.row, index] : [index, entry.col]);
  }

  function activeEntry() {
    const [row, col] = selected;
    return direction === "across" ? clues.across[row] : clues.down[col];
  }

  function cellAt(row, col) {
    return gridEl.querySelector(`[data-row="${row}"][data-col="${col}"]`);
  }

  function switchClueTab(nextDirection) {
    const across = nextDirection === "across";
    document.getElementById("acrossTab").setAttribute("aria-selected", String(across));
    document.getElementById("downTab").setAttribute("aria-selected", String(!across));
    document.getElementById("acrossClues").hidden = !across;
    document.getElementById("downClues").hidden = across;
  }

  function updateSelection() {
    const entry = activeEntry();
    const activeCells = new Set(entryCells(direction, entry).map(([row, col]) => `${row},${col}`));
    gridEl.querySelectorAll(".cell").forEach(cell => {
      const key = `${cell.dataset.row},${cell.dataset.col}`;
      cell.classList.toggle("related", activeCells.has(key));
      cell.classList.toggle("active", Number(cell.dataset.row) === selected[0] && Number(cell.dataset.col) === selected[1]);
    });
    document.querySelectorAll(".clue").forEach(clue => {
      clue.classList.toggle("active", clue.dataset.direction === direction && Number(clue.dataset.number) === entry.number);
    });
    currentNumber.textContent = `${entry.number}${direction === "across" ? "A" : "D"}`;
    currentDirection.textContent = direction;
    currentText.textContent = entry.clue;
    switchClueTab(direction);
  }

  function updateProgress() {
    const filled = answers.flat().filter(Boolean).length;
    progressText.textContent = `${filled} / ${SIZE * SIZE}`;
    progressFill.style.width = `${(filled / (SIZE * SIZE)) * 100}%`;
    for (const clueDirection of ["across", "down"]) {
      clues[clueDirection].forEach(entry => {
        const solved = entryCells(clueDirection, entry).every(([row, col], index) => answers[row][col] === entry.answer[index]);
        const clue = document.querySelector(`.clue[data-direction="${clueDirection}"][data-number="${entry.number}"]`);
        if (clue) clue.classList.toggle("solved", solved);
      });
    }
  }

  function updateCell(row, col) {
    const cell = cellAt(row, col);
    const number = cell.querySelector(".cell-number");
    cell.textContent = answers[row][col];
    if (number) cell.appendChild(number);
    cell.setAttribute("aria-label", `Row ${row + 1}, column ${col + 1}${answers[row][col] ? `, ${answers[row][col]}` : ", empty"}`);
  }

  function selectCell(row, col, nextDirection = null) {
    if (selected[0] === row && selected[1] === col && !nextDirection) direction = direction === "across" ? "down" : "across";
    else {
      selected = [row, col];
      if (nextDirection) direction = nextDirection;
    }
    updateSelection();
    cellAt(row, col).focus({ preventScroll: true });
  }

  function move(step) {
    const entry = activeEntry();
    const cells = entryCells(direction, entry);
    const index = cells.findIndex(([row, col]) => row === selected[0] && col === selected[1]);
    const next = cells[Math.max(0, Math.min(cells.length - 1, index + step))];
    selected = next;
    updateSelection();
    cellAt(...next).focus({ preventScroll: true });
  }

  function enterLetter(letter) {
    const [row, col] = selected;
    answers[row][col] = letter;
    cellAt(row, col).classList.remove("incorrect");
    updateCell(row, col);
    updateProgress();
    move(1);
    messageEl.textContent = "";
    messageEl.className = "status";
  }

  function eraseLetter() {
    const [row, col] = selected;
    if (answers[row][col]) {
      answers[row][col] = "";
      cellAt(row, col).classList.remove("incorrect");
      updateCell(row, col);
    } else {
      move(-1);
      const [previousRow, previousCol] = selected;
      answers[previousRow][previousCol] = "";
      cellAt(previousRow, previousCol).classList.remove("incorrect");
      updateCell(previousRow, previousCol);
    }
    updateProgress();
  }

  function handleKey(event) {
    if (document.querySelector(".game-calculator-overlay.open")) return;
    if (/^[a-zA-Z]$/.test(event.key)) {
      event.preventDefault();
      enterLetter(event.key.toUpperCase());
    } else if (event.key === "Backspace" || event.key === "Delete") {
      event.preventDefault();
      eraseLetter();
    } else if (event.key === " ") {
      event.preventDefault();
      direction = direction === "across" ? "down" : "across";
      updateSelection();
    } else if (event.key.startsWith("Arrow")) {
      event.preventDefault();
      const [row, col] = selected;
      const nextRow = Math.max(0, Math.min(SIZE - 1, row + (event.key === "ArrowDown" ? 1 : event.key === "ArrowUp" ? -1 : 0)));
      const nextCol = Math.max(0, Math.min(SIZE - 1, col + (event.key === "ArrowRight" ? 1 : event.key === "ArrowLeft" ? -1 : 0)));
      selected = [nextRow, nextCol];
      direction = event.key === "ArrowUp" || event.key === "ArrowDown" ? "down" : "across";
      updateSelection();
      cellAt(nextRow, nextCol).focus({ preventScroll: true });
    }
  }

  function renderGrid() {
    for (let row = 0; row < SIZE; row++) {
      for (let col = 0; col < SIZE; col++) {
        const cell = document.createElement("button");
        cell.className = "cell";
        cell.type = "button";
        cell.setAttribute("role", "gridcell");
        cell.dataset.row = row;
        cell.dataset.col = col;
        const number = numberMap.get(`${row},${col}`);
        if (number) {
          const numberEl = document.createElement("span");
          numberEl.className = "cell-number";
          numberEl.textContent = number;
          cell.appendChild(numberEl);
        }
        cell.setAttribute("aria-label", `Row ${row + 1}, column ${col + 1}, empty`);
        cell.addEventListener("click", () => selectCell(row, col));
        gridEl.appendChild(cell);
      }
    }
  }

  function renderClues(clueDirection) {
    const container = document.getElementById(`${clueDirection}Clues`);
    clues[clueDirection].forEach(entry => {
      const button = document.createElement("button");
      button.className = "clue";
      button.type = "button";
      button.dataset.direction = clueDirection;
      button.dataset.number = entry.number;
      button.innerHTML = `<span class="clue-number">${entry.number}</span><span>${entry.clue}</span>`;
      button.addEventListener("click", () => {
        direction = clueDirection;
        selected = entryCells(clueDirection, entry)[0];
        updateSelection();
        cellAt(...selected).focus({ preventScroll: true });
      });
      container.appendChild(button);
    });
  }

  function renderKeyboard() {
    "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").forEach(letter => {
      const key = document.createElement("button");
      key.className = "key";
      key.type = "button";
      key.textContent = letter;
      key.setAttribute("aria-label", letter);
      key.addEventListener("click", () => enterLetter(letter));
      keyboardEl.appendChild(key);
    });
    const erase = document.createElement("button");
    erase.className = "key wide";
    erase.type = "button";
    erase.textContent = "Delete";
    erase.addEventListener("click", eraseLetter);
    keyboardEl.appendChild(erase);
  }

  function clearWord() {
    const entry = activeEntry();
    entryCells(direction, entry).forEach(([row, col]) => {
      answers[row][col] = "";
      cellAt(row, col).classList.remove("incorrect");
      updateCell(row, col);
    });
    updateProgress();
    messageEl.textContent = "";
    messageEl.className = "status";
  }

  function revealWord() {
    const entry = activeEntry();
    entryCells(direction, entry).forEach(([row, col], index) => {
      answers[row][col] = entry.answer[index];
      cellAt(row, col).classList.remove("incorrect");
      updateCell(row, col);
    });
    updateProgress();
    messageEl.textContent = `${entry.number} ${direction} revealed.`;
    messageEl.className = "status";
  }

  function checkPuzzle() {
    let filled = 0;
    let incorrect = 0;
    for (let row = 0; row < SIZE; row++) {
      for (let col = 0; col < SIZE; col++) {
        const hasAnswer = Boolean(answers[row][col]);
        const isWrong = hasAnswer && answers[row][col] !== solution[row][col];
        if (hasAnswer) filled += 1;
        if (isWrong) incorrect += 1;
        cellAt(row, col).classList.toggle("incorrect", isWrong);
      }
    }
    if (filled === SIZE * SIZE && incorrect === 0) {
      messageEl.textContent = "Puzzle complete. Nicely done.";
      messageEl.className = "status success";
    } else if (incorrect) {
      messageEl.textContent = `${incorrect} ${incorrect === 1 ? "square needs" : "squares need"} another look.`;
      messageEl.className = "status error";
    } else {
      messageEl.textContent = "Everything entered so far is correct.";
      messageEl.className = "status success";
    }
  }

  document.getElementById("acrossTab").addEventListener("click", () => switchClueTab("across"));
  document.getElementById("downTab").addEventListener("click", () => switchClueTab("down"));
  document.getElementById("clearBtn").addEventListener("click", clearWord);
  document.getElementById("revealBtn").addEventListener("click", revealWord);
  document.getElementById("checkBtn").addEventListener("click", checkPuzzle);
  document.addEventListener("keydown", handleKey);
  renderGrid();
  renderClues("across");
  renderClues("down");
  renderKeyboard();
  updateSelection();
  updateProgress();
})();
</script>
</body>
</html>
