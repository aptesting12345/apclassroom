<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>2048</title>
<style>
:root {
  --bg: #faf8ef;
  --ink: #776e65;
  --muted: #8f7a66;
  --panel: #bbada0;
  --empty: rgba(238, 228, 218, 0.35);
  --accent: #8f7a66;
  --button: #8f7a66;
  --tile-text: #776e65;
  --tile-bright-text: #f9f6f2;
  --tile-2: #eee4da;
  --tile-4: #ede0c8;
  --tile-8: #f2b179;
  --tile-16: #f59563;
  --tile-32: #f67c5f;
  --tile-64: #f65e3b;
  --tile-128: #edcf72;
  --tile-256: #edcc61;
  --tile-512: #edc850;
  --tile-1024: #edc53f;
  --tile-2048: #8f7a66;
  --tile-big: #3c3a32;
  --font: Arial, Helvetica, sans-serif;
}
[data-theme="cupcake"] {
  --bg: #fff7fb;
  --ink: #5e2947;
  --muted: #9b4c77;
  --panel: #f2a6c8;
  --empty: rgba(255, 255, 255, 0.42);
  --accent: #d94686;
  --button: #c02664;
  --tile-2: #fff1df;
  --tile-4: #f7d4b3;
  --tile-8: #ffd166;
  --tile-16: #f8a5c2;
  --tile-32: #9be7c4;
  --tile-64: #c7a4ff;
  --tile-128: #d94f70;
  --tile-256: #f7b7d2;
  --tile-512: #d9b8ff;
  --tile-1024: #f59ac1;
  --tile-2048: #b83280;
  --tile-big: #6f1d58;
}
[data-theme="doge"] {
  --bg: #fff8dc;
  --ink: #604019;
  --muted: #8a642f;
  --panel: #d6ad60;
  --empty: rgba(255, 255, 255, 0.36);
  --accent: #b7791f;
  --button: #9c6212;
  --tile-2: #fff4b8;
  --tile-4: #f7dc84;
  --tile-8: #f6c453;
  --tile-16: #e7a928;
  --tile-32: #cf8f13;
  --tile-64: #b57515;
  --tile-128: #8fd3ff;
  --tile-256: #67b7dc;
  --tile-512: #9ad57a;
  --tile-1024: #62b950;
  --tile-2048: #d94625;
  --tile-big: #5f3711;
}
[data-theme="space"] {
  --bg: #10131f;
  --ink: #eef2ff;
  --muted: #b8c1df;
  --panel: #29334d;
  --empty: rgba(148, 163, 184, 0.2);
  --accent: #8b5cf6;
  --button: #4f46e5;
  --tile-text: #172033;
  --tile-2: #dbeafe;
  --tile-4: #bfdbfe;
  --tile-8: #93c5fd;
  --tile-16: #7dd3fc;
  --tile-32: #67e8f9;
  --tile-64: #5eead4;
  --tile-128: #c4b5fd;
  --tile-256: #a78bfa;
  --tile-512: #818cf8;
  --tile-1024: #f0abfc;
  --tile-2048: #f472b6;
  --tile-big: #312e81;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100dvh;
  padding: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
}
.app { width: min(100%, 520px); }
.topbar, .actions, .scores {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.topbar { margin-bottom: 16px; }
.left { display: flex; align-items: center; gap: 10px; }
.icon-btn {
  width: 42px;
  height: 42px;
  padding: 0;
  border: 0;
  border-radius: 12px;
  display: inline-grid;
  place-items: center;
  flex: 0 0 42px;
  line-height: 1;
  color: #fff;
  background: var(--button);
  text-decoration: none;
  cursor: pointer;
}
.icon-btn svg { display: block; width: 22px; height: 22px; }
h1 { margin: 0; font-size: 54px; line-height: 1; letter-spacing: 0; }
.score {
  min-width: 82px;
  padding: 8px 12px;
  border-radius: 8px;
  color: #fff;
  background: var(--panel);
  text-align: center;
}
.label { display: block; font-size: 11px; font-weight: 800; text-transform: uppercase; opacity: 0.75; }
.value { display: block; font-size: 21px; font-weight: 900; }
.intro {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
  color: var(--muted);
  font-size: 15px;
  line-height: 1.4;
}
.actions { flex: none; }
button, select {
  height: 42px;
  border: 0;
  border-radius: 8px;
  padding: 0 14px;
  color: #fff;
  background: var(--button);
  font-weight: 800;
  cursor: pointer;
}
select { color: var(--ink); background: rgba(255, 255, 255, 0.7); border: 1px solid rgba(0, 0, 0, 0.1); }
.board {
  position: relative;
  --pad: 14px;
  --gap: 14px;
  width: 100%;
  aspect-ratio: 1 / 1;
  padding: var(--pad);
  border-radius: 10px;
  background: var(--panel);
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-template-rows: repeat(4, 1fr);
  gap: var(--gap);
  overflow: hidden;
}
.cell {
  border-radius: 7px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  aspect-ratio: 1 / 1;
  background: var(--empty);
}
.tile-layer {
  position: absolute;
  inset: var(--pad);
  pointer-events: none;
}
.tile {
  position: absolute;
  top: 0;
  left: 0;
  width: calc((100% - (3 * var(--gap))) / 4);
  height: calc((100% - (3 * var(--gap))) / 4);
  border-radius: 7px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 4px;
  color: var(--tile-text);
  font-size: clamp(17px, 6.4vw, 42px);
  font-weight: 900;
  line-height: 1.04;
  text-align: center;
  overflow: hidden;
  word-break: break-word;
  transform: translate(0, 0);
  scale: 1;
  transition: transform 150ms ease;
  will-change: transform;
}
.tile.new { animation: appear 150ms ease 130ms both; }
.tile.merged { animation: merge-pop 180ms ease 130ms both; z-index: 3; }
.tile.ghost { opacity: 0.72; z-index: 2; }
.v2 { background: var(--tile-2); }
.v4 { background: var(--tile-4); }
.v8 { background: var(--tile-8); color: var(--tile-bright-text); }
.v16 { background: var(--tile-16); color: var(--tile-bright-text); }
.v32 { background: var(--tile-32); color: var(--tile-bright-text); }
.v64 { background: var(--tile-64); color: var(--tile-bright-text); }
.v128 { background: var(--tile-128); color: var(--tile-bright-text); font-size: clamp(15px, 5.4vw, 34px); }
.v256 { background: var(--tile-256); color: var(--tile-bright-text); font-size: clamp(15px, 5.4vw, 34px); }
.v512 { background: var(--tile-512); color: var(--tile-bright-text); font-size: clamp(15px, 5.4vw, 34px); }
.v1024 { background: var(--tile-1024); color: var(--tile-bright-text); font-size: clamp(14px, 5vw, 30px); }
.v2048 { background: var(--tile-2048); color: #fff; font-size: clamp(14px, 5vw, 30px); }
.v4096, .v8192 { background: var(--tile-big); color: #fff; font-size: clamp(13px, 4.8vw, 28px); }
.message {
  margin-top: 14px;
  min-height: 22px;
  color: var(--muted);
  font-weight: 800;
  text-align: center;
}
@keyframes appear { from { opacity: 0; scale: 0.72; } to { opacity: 1; scale: 1; } }
@keyframes merge-pop { 0% { scale: 1; } 55% { scale: 1.16; } 100% { scale: 1; } }
@media (max-width: 520px) {
  body { padding: 12px; }
  h1 { font-size: 42px; }
  .topbar, .intro { align-items: flex-start; }
  .intro { flex-direction: column; }
  .board { --pad: 10px; --gap: 10px; }
}
</style>
</head>
<body data-theme="classic">
<div class="app">
  <header class="topbar">
    <div class="left">
      <a class="icon-btn" href="index.html" data-calculator-back aria-label="Back to calculator" title="Back to calculator">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/><path d="M21 12H9"/></svg>
      </a>
      <h1>2048</h1>
    </div>
    <div class="scores">
      <div class="score"><span class="label">Score</span><span class="value" id="score">0</span></div>
      <div class="score"><span class="label">Best</span><span class="value" id="best">0</span></div>
    </div>
  </header>

  <div class="intro">
    <strong>Join the tiles, get to 2048.</strong>
    <div class="actions">
      <select id="theme" aria-label="Theme">
        <option value="classic">Classic</option>
        <option value="cupcake">Cupcake</option>
        <option value="doge">Doge</option>
        <option value="space">Space</option>
      </select>
      <button id="undo" type="button">Undo</button>
      <button id="new" type="button">New</button>
    </div>
  </div>

  <div class="board" id="board" aria-label="2048 board"></div>
  <div class="message" id="message"></div>
</div>

<script src="game-guard.js?v=2"></script>
<script>
(() => {
  const boardEl = document.getElementById("board");
  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const messageEl = document.getElementById("message");
  const themeEl = document.getElementById("theme");
  const THEME_LABELS = {
    cupcake: {
      2: "Vanilla", 4: "Choco", 8: "Lemon", 16: "Berry",
      32: "Mint", 64: "Mocha", 128: "Red Velvet", 256: "Sprinkle",
      512: "Macaron", 1024: "Cupcake", 2048: "Cake Tower",
      4096: "Sugar Rush", 8192: "Sweet Win"
    },
    doge: {
      2: "much", 4: "wow", 8: "very", 16: "such",
      32: "amaze", 64: "so skill", 128: "many tiles",
      256: "merge", 512: "to moon", 1024: "much score",
      2048: "doge king", 4096: "wow+", 8192: "very win"
    },
    space: {
      2: "Moon", 4: "Comet", 8: "Orbit", 16: "Rocket",
      32: "Nebula", 64: "Aurora", 128: "Galaxy",
      256: "Quasar", 512: "Pulsar", 1024: "Supernova",
      2048: "Black Hole", 4096: "Deep Space", 8192: "Cosmos"
    }
  };
  const VECTORS = {
    left: { r: 0, c: -1, rows: [0, 1, 2, 3], cols: [0, 1, 2, 3] },
    right: { r: 0, c: 1, rows: [0, 1, 2, 3], cols: [3, 2, 1, 0] },
    up: { r: -1, c: 0, rows: [0, 1, 2, 3], cols: [0, 1, 2, 3] },
    down: { r: 1, c: 0, rows: [3, 2, 1, 0], cols: [0, 1, 2, 3] }
  };

  let tiles, tileLayer, score, best, previous, touchStart, nextId, moving, ghostTiles;
  best = Number(localStorage.getItem("game_2048_best") || "0");
  bestEl.textContent = best;

  function buildBoard() {
    boardEl.innerHTML = "";
    for (let i = 0; i < 16; i++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      boardEl.appendChild(cell);
    }
    tileLayer = document.createElement("div");
    tileLayer.className = "tile-layer";
    boardEl.appendChild(tileLayer);
  }

  function cloneTiles(source = tiles) {
    return source.map(tile => ({ ...tile }));
  }

  function matrix() {
    const grid = Array.from({ length: 4 }, () => Array(4).fill(null));
    tiles.forEach(tile => { grid[tile.row][tile.col] = tile; });
    return grid;
  }

  function emptyCells() {
    const empty = [];
    const grid = matrix();
    for (let r = 0; r < 4; r++) {
      for (let c = 0; c < 4; c++) {
        if (!grid[r][c]) empty.push([r, c]);
      }
    }
    return empty;
  }

  function addTile() {
    const empty = emptyCells();
    if (!empty.length) return;
    const [r, c] = empty[Math.floor(Math.random() * empty.length)];
    tiles.push({
      id: nextId++,
      value: Math.random() < 0.9 ? 2 : 4,
      row: r,
      col: c,
      previousRow: r,
      previousCol: c,
      isNew: true,
      merged: false
    });
  }

  function tileClass(value) {
    return `v${Math.min(value, 8192)}`;
  }

  function tileLabel(value) {
    return THEME_LABELS[themeEl.value]?.[value] || value;
  }

  function tilePosition(row, col) {
    return `translate(calc(${col} * (100% + var(--gap))), calc(${row} * (100% + var(--gap))))`;
  }

  function render(animated = true) {
    scoreEl.textContent = score;
    best = Math.max(best, score);
    localStorage.setItem("game_2048_best", String(best));
    bestEl.textContent = best;
    tileLayer.innerHTML = "";

    [...tiles, ...ghostTiles].forEach(tile => {
      const el = document.createElement("div");
      el.className = `tile ${tileClass(tile.value)}`;
      if (tile.isNew) el.classList.add("new");
      if (tile.merged) el.classList.add("merged");
      if (tile.ghost) el.classList.add("ghost");
      el.textContent = tileLabel(tile.value);
      el.title = String(tile.value);

      const startRow = tile.previousRow ?? tile.row;
      const startCol = tile.previousCol ?? tile.col;
      el.style.transform = animated ? tilePosition(startRow, startCol) : tilePosition(tile.row, tile.col);
      tileLayer.appendChild(el);
      if (animated) requestAnimationFrame(() => { el.style.transform = tilePosition(tile.row, tile.col); });
    });

    tiles.forEach(tile => {
      tile.previousRow = tile.row;
      tile.previousCol = tile.col;
      tile.isNew = false;
      tile.merged = false;
    });
  }

  function newGame() {
    tiles = [];
    ghostTiles = [];
    score = 0;
    previous = null;
    nextId = 1;
    moving = false;
    messageEl.textContent = "";
    addTile();
    addTile();
    render(false);
  }

  function inBounds(row, col) {
    return row >= 0 && row < 4 && col >= 0 && col < 4;
  }

  function move(dir) {
    if (moving) return;
    const vector = VECTORS[dir];
    if (!vector) return;
    const grid = matrix();
    const mergedAway = new Set();
    let moved = false;

    previous = { tiles: cloneTiles(), score, nextId };
    ghostTiles = [];
    tiles.forEach(tile => {
      tile.previousRow = tile.row;
      tile.previousCol = tile.col;
      tile.isNew = false;
      tile.merged = false;
    });

    vector.rows.forEach(row => {
      vector.cols.forEach(col => {
        const tile = grid[row][col];
        if (!tile || mergedAway.has(tile.id)) return;
        grid[row][col] = null;

        let nextRow = row;
        let nextCol = col;
        while (inBounds(nextRow + vector.r, nextCol + vector.c) && !grid[nextRow + vector.r][nextCol + vector.c]) {
          nextRow += vector.r;
          nextCol += vector.c;
        }

        const mergeRow = nextRow + vector.r;
        const mergeCol = nextCol + vector.c;
        const target = inBounds(mergeRow, mergeCol) ? grid[mergeRow][mergeCol] : null;

        if (target && target.value === tile.value && !target.merged) {
          tile.row = target.row;
          tile.col = target.col;
          ghostTiles.push({ ...tile, ghost: true });
          target.value *= 2;
          target.merged = true;
          score += target.value;
          moved = true;
          mergedAway.add(tile.id);
        } else {
          tile.row = nextRow;
          tile.col = nextCol;
          grid[nextRow][nextCol] = tile;
          if (tile.row !== tile.previousRow || tile.col !== tile.previousCol) moved = true;
        }
      });
    });

    if (!moved) {
      previous = null;
      ghostTiles = [];
      render(false);
      return;
    }

    tiles = tiles.filter(tile => !mergedAway.has(tile.id));
    addTile();
    moving = true;
    render(true);

    setTimeout(() => {
      moving = false;
      ghostTiles = [];
      render(false);
      if (tiles.some(tile => tile.value === 2048)) messageEl.textContent = "2048 reached. Keep going.";
      else if (!canMove()) messageEl.textContent = "No moves left.";
    }, 210);
  }

  function canMove() {
    if (emptyCells().length) return true;
    const grid = matrix();
    for (let r = 0; r < 4; r++) {
      for (let c = 0; c < 4; c++) {
        if (grid[r][c]?.value === grid[r + 1]?.[c]?.value || grid[r][c]?.value === grid[r]?.[c + 1]?.value) return true;
      }
    }
    return false;
  }

  function undo() {
    if (!previous) return;
    tiles = cloneTiles(previous.tiles);
    score = previous.score;
    nextId = previous.nextId;
    ghostTiles = [];
    previous = null;
    messageEl.textContent = "";
    render(false);
  }

  document.addEventListener("keydown", event => {
    const map = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right", w: "up", s: "down", a: "left", d: "right", W: "up", S: "down", A: "left", D: "right" };
    if (!map[event.key]) return;
    event.preventDefault();
    move(map[event.key]);
  });
  boardEl.addEventListener("touchstart", event => {
    const t = event.touches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  boardEl.addEventListener("touchend", event => {
    if (!touchStart) return;
    const t = event.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    touchStart = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
  }, { passive: true });
  document.getElementById("new").addEventListener("click", newGame);
  document.getElementById("undo").addEventListener("click", undo);
  themeEl.addEventListener("change", () => {
    document.body.dataset.theme = themeEl.value;
    localStorage.setItem("game_2048_theme", themeEl.value);
    render(false);
  });
  const savedTheme = localStorage.getItem("game_2048_theme") || "classic";
  themeEl.value = [...themeEl.options].some(option => option.value === savedTheme) ? savedTheme : "classic";
  document.body.dataset.theme = themeEl.value;
  buildBoard();
  newGame();
})();
</script>
</body>
</html>
