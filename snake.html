<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Snake</title>
<style>
:root {
  --bg: #f8fafc;
  --ink: #202124;
  --muted: #5f6368;
  --panel: #ffffff;
  --line: #dadce0;
  --green: #34a853;
  --board: #9bd15d;
  --board-dark: #8cc84f;
  --snake: #1a73e8;
  --snake-dark: #185abc;
  --food: #fbbc04;
  --danger: #ea4335;
  --shadow: 0 12px 34px rgba(60, 64, 67, 0.18);
  --font: Arial, Helvetica, sans-serif;
}

* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px;
  color: var(--ink);
  background: radial-gradient(circle at top, #e8f0fe 0, var(--bg) 46%);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}

.app {
  width: min(100%, 680px);
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
}

.left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.icon-btn {
  width: 42px;
  height: 42px;
  border: 1px solid var(--line);
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  background: var(--panel);
  box-shadow: 0 1px 2px rgba(60, 64, 67, 0.12);
  cursor: pointer;
  text-decoration: none;
}

.icon-btn:hover { color: var(--ink); background: #f1f3f4; }

.title {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 28px;
  font-weight: 700;
  letter-spacing: 0;
}

.snake-mark {
  width: 32px;
  height: 32px;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--green), #8bc34a);
  position: relative;
}

.snake-mark::before,
.snake-mark::after {
  content: "";
  position: absolute;
  width: 5px;
  height: 5px;
  top: 8px;
  border-radius: 50%;
  background: #fff;
}

.snake-mark::before { left: 8px; }
.snake-mark::after { right: 8px; }

.stats {
  display: flex;
  align-items: center;
  gap: 10px;
}

.score {
  min-width: 76px;
  padding: 8px 12px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--panel);
  text-align: right;
}

.label {
  display: block;
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
}

.value {
  font-size: 20px;
  font-weight: 800;
}

.stage {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  border-radius: 26px;
  overflow: hidden;
  background: var(--board);
  border: 10px solid #7cb342;
  box-shadow: var(--shadow);
}

canvas {
  width: 100%;
  height: 100%;
  display: block;
}

.overlay {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 26px;
  background: rgba(232, 245, 233, 0.82);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  text-align: center;
}

.overlay.active { display: flex; }

.card {
  width: min(100%, 360px);
  padding: 24px;
  border-radius: 24px;
  background: var(--panel);
  box-shadow: 0 10px 28px rgba(60, 64, 67, 0.22);
}

.card h2 {
  margin: 0 0 8px;
  font-size: 30px;
}

.card p {
  margin: 0 0 18px;
  color: var(--muted);
  font-size: 15px;
  line-height: 1.4;
}

.primary {
  min-width: 132px;
  min-height: 46px;
  padding: 0 22px;
  border: none;
  border-radius: 999px;
  color: #fff;
  background: var(--green);
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
}

.controls {
  margin-top: 14px;
  display: grid;
  grid-template-columns: repeat(3, 62px);
  justify-content: center;
  gap: 8px;
}

.pad {
  height: 54px;
  border: 1px solid var(--line);
  border-radius: 18px;
  color: var(--ink);
  background: var(--panel);
  font-size: 22px;
  cursor: pointer;
}

.empty { visibility: hidden; }

.hint {
  margin-top: 12px;
  color: var(--muted);
  font-size: 13px;
  text-align: center;
}

@media (min-width: 680px) {
  .controls { display: none; }
}

@media (max-width: 520px) {
  body { padding: 10px; }
  .title { font-size: 22px; }
  .score { min-width: 64px; padding: 7px 10px; }
  .value { font-size: 18px; }
  .stage { border-width: 7px; border-radius: 20px; }
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="left">
      <a class="icon-btn" href="index.html" aria-label="Back to games" title="Back to games">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/><path d="M21 12H9"/></svg>
      </a>
      <div class="title"><span class="snake-mark" aria-hidden="true"></span><span>Snake</span></div>
    </div>
    <div class="stats">
      <div class="score"><span class="label">Score</span><span class="value" id="score">0</span></div>
      <div class="score"><span class="label">Best</span><span class="value" id="best">0</span></div>
    </div>
  </header>

  <div class="stage" id="stage">
    <canvas id="canvas" width="640" height="640" aria-label="Snake game board"></canvas>
    <div class="overlay active" id="overlay">
      <div class="card">
        <h2 id="overlay-title">Snake</h2>
        <p id="overlay-copy">Eat fruit, grow longer, and keep moving. Use arrows, WASD, swipe, or the buttons.</p>
        <button class="primary" id="play-btn" type="button">Play</button>
      </div>
    </div>
  </div>

  <div class="controls" aria-label="Touch controls">
    <button class="pad empty" type="button" aria-hidden="true"></button>
    <button class="pad" data-dir="up" type="button" aria-label="Up">▲</button>
    <button class="pad empty" type="button" aria-hidden="true"></button>
    <button class="pad" data-dir="left" type="button" aria-label="Left">◀</button>
    <button class="pad" data-dir="down" type="button" aria-label="Down">▼</button>
    <button class="pad" data-dir="right" type="button" aria-label="Right">▶</button>
  </div>
  <div class="hint">Arrow keys or WASD to move. Space pauses.</div>
</div>

<script>
(() => {
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const overlay = document.getElementById("overlay");
  const overlayTitle = document.getElementById("overlay-title");
  const overlayCopy = document.getElementById("overlay-copy");
  const playBtn = document.getElementById("play-btn");
  const stage = document.getElementById("stage");
  const grid = 21;
  const cell = canvas.width / grid;
  const moveMs = 112;

  let snake;
  let previousSnake;
  let dir;
  let nextDir;
  let food;
  let score;
  let best = Number(localStorage.getItem("googleish_snake_best") || "0");
  let state = "ready";
  let lastMove = 0;
  let raf = 0;
  let touchStart = null;

  bestEl.textContent = best;

  function reset() {
    const mid = Math.floor(grid / 2);
    snake = [
      { x: mid, y: mid },
      { x: mid - 1, y: mid },
      { x: mid - 2, y: mid }
    ];
    previousSnake = snake.map(part => ({ ...part }));
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    placeFood();
    updateScore();
  }

  function updateScore() {
    scoreEl.textContent = score;
    bestEl.textContent = best;
  }

  function placeFood() {
    do {
      food = {
        x: Math.floor(Math.random() * grid),
        y: Math.floor(Math.random() * grid)
      };
    } while (snake.some(part => part.x === food.x && part.y === food.y));
  }

  function showOverlay(title, copy, button) {
    overlayTitle.textContent = title;
    overlayCopy.textContent = copy;
    playBtn.textContent = button;
    overlay.classList.add("active");
  }

  function hideOverlay() {
    overlay.classList.remove("active");
  }

  function start() {
    reset();
    state = "playing";
    lastMove = performance.now();
    hideOverlay();
  }

  function pause() {
    if (state !== "playing") return;
    state = "paused";
    showOverlay("Paused", "Take a breath. Your run is saved right here.", "Resume");
  }

  function resume() {
    if (state !== "paused") return;
    state = "playing";
    lastMove = performance.now();
    hideOverlay();
  }

  function end() {
    state = "over";
    if (score > best) {
      best = score;
      localStorage.setItem("googleish_snake_best", String(best));
    }
    updateScore();
    showOverlay("Game over", `Final score: ${score}`, "Play Again");
  }

  function setDirection(x, y) {
    if (state === "ready" || state === "over") start();
    if (state !== "playing") return;
    if (x === -dir.x && y === -dir.y) return;
    nextDir = { x, y };
  }

  function step(now) {
    previousSnake = snake.map(part => ({ ...part }));
    dir = nextDir;
    const head = {
      x: snake[0].x + dir.x,
      y: snake[0].y + dir.y
    };
    const willEat = head.x === food.x && head.y === food.y;
    const bodyToCheck = willEat ? snake : snake.slice(0, -1);

    if (
      head.x < 0 ||
      head.y < 0 ||
      head.x >= grid ||
      head.y >= grid ||
      bodyToCheck.some(part => part.x === head.x && part.y === head.y)
    ) {
      end();
      return;
    }

    snake.unshift(head);
    if (willEat) {
      score += 1;
      if (score > best) best = score;
      placeFood();
    } else {
      snake.pop();
    }
    updateScore();
    lastMove = now;
  }

  function roundedRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw(now) {
    if (state === "playing" && now - lastMove >= moveMs) {
      step(now);
    }

    const progress = state === "playing" ? Math.min((now - lastMove) / moveMs, 1) : 0;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (let y = 0; y < grid; y++) {
      for (let x = 0; x < grid; x++) {
        ctx.fillStyle = (x + y) % 2 ? "#8fcf53" : "#9bd65d";
        ctx.fillRect(x * cell, y * cell, cell, cell);
      }
    }

    const foodX = food.x * cell + cell / 2;
    const foodY = food.y * cell + cell / 2;
    ctx.fillStyle = "#fbbc04";
    ctx.beginPath();
    ctx.arc(foodX, foodY, cell * 0.34 + Math.sin(now / 150) * 1.8, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#ea4335";
    ctx.beginPath();
    ctx.arc(foodX + cell * 0.1, foodY - cell * 0.1, cell * 0.12, 0, Math.PI * 2);
    ctx.fill();

    snake.forEach((part, index) => {
      const prev = previousSnake[index] || part;
      const x = (prev.x + (part.x - prev.x) * progress) * cell + 3;
      const y = (prev.y + (part.y - prev.y) * progress) * cell + 3;
      const size = cell - 6;
      ctx.fillStyle = index === 0 ? "#1a73e8" : "#185abc";
      roundedRect(x, y, size, size, size * 0.35);
      ctx.fill();

      if (index === 0) {
        ctx.fillStyle = "#fff";
        const eyeOffsetX = dir.x !== 0 ? dir.x * size * 0.18 : size * 0.18;
        const eyeOffsetY = dir.y !== 0 ? dir.y * size * 0.18 : -size * 0.02;
        ctx.beginPath();
        ctx.arc(x + size * 0.36 + eyeOffsetX, y + size * 0.36 + eyeOffsetY, size * 0.08, 0, Math.PI * 2);
        ctx.arc(x + size * 0.64 + eyeOffsetX, y + size * 0.36 + eyeOffsetY, size * 0.08, 0, Math.PI * 2);
        ctx.fill();
      }
    });

    raf = requestAnimationFrame(draw);
  }

  document.addEventListener("keydown", event => {
    const key = event.key;
    if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(key)) event.preventDefault();
    if (key === " ") {
      if (state === "playing") pause();
      else if (state === "paused") resume();
      else start();
      return;
    }
    if (key === "ArrowUp" || key === "w" || key === "W") setDirection(0, -1);
    if (key === "ArrowDown" || key === "s" || key === "S") setDirection(0, 1);
    if (key === "ArrowLeft" || key === "a" || key === "A") setDirection(-1, 0);
    if (key === "ArrowRight" || key === "d" || key === "D") setDirection(1, 0);
  });

  document.querySelector(".controls").addEventListener("click", event => {
    const button = event.target.closest("[data-dir]");
    if (!button) return;
    const map = {
      up: [0, -1],
      down: [0, 1],
      left: [-1, 0],
      right: [1, 0]
    };
    setDirection(...map[button.dataset.dir]);
  });

  stage.addEventListener("touchstart", event => {
    const touch = event.touches[0];
    touchStart = { x: touch.clientX, y: touch.clientY };
  }, { passive: true });

  stage.addEventListener("touchend", event => {
    if (!touchStart) return;
    const touch = event.changedTouches[0];
    const dx = touch.clientX - touchStart.x;
    const dy = touch.clientY - touchStart.y;
    touchStart = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) setDirection(dx > 0 ? 1 : -1, 0);
    else setDirection(0, dy > 0 ? 1 : -1);
  }, { passive: true });

  playBtn.addEventListener("click", () => {
    if (state === "paused") resume();
    else start();
  });

  reset();
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(draw);
})();
</script>
</body>
</html>
